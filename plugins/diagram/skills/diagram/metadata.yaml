schema-version: 1
purpose: Turn a spec/code scope into a hardened diagram-model JSON, then render it into ONE committable HTML page (one file, React Flow + ELK, libraries loaded from a CDN at view time) where node kind and subsystem are encoded automatically for readability.
best-for: Teams who want an accurate, clickable "how it works" diagram (classes/objects/components/permission sets + relations) committed alongside a spec or module — with a heterogeneous mix of node kinds (react / apex / lambda / object) kept visually distinct — instead of a hand-drawn or memory-derived picture.
needs: []
changes:
  tags: [files]
  notes: Writes a docs/diagrams/<name>/ folder — the <name>.diagram.json model (the Sextant-hardened source of truth) and the built <name>.html (no sibling files, model inlined) — via references/build-spec-diagram.mjs. The build itself touches no network; the produced HTML loads its three libraries (React, React Flow, elkjs) from a CDN (esm.sh) at view time, so opening it needs network. Does not touch git, org, or money.
